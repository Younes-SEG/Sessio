name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [unit, quality, build, tenancy, smoke, security]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: command_ci
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: command_ci_runner
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U command_ci -d command_ci_runner"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://command_ci:ci-only-disposable@127.0.0.1:5432/command_ci_runner
      DATABASE_URL_UNPOOLED: ''
      COMMAND_HOSTED: 'false'
      VERCEL: ''
      CI: 'true'
      COMMAND_CI_BUILD: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - if: matrix.check == 'unit'
        run: npm test
      - if: matrix.check == 'quality'
        run: npm run lint && npx next typegen && npm run typecheck
      - if: matrix.check == 'build' || matrix.check == 'smoke'
        run: npm run build
      - if: matrix.check == 'tenancy'
        run: npm run test:tenancy && npm run test:privacy-db
      - if: matrix.check == 'smoke'
        run: |
          npx prisma migrate deploy
          npx playwright install --with-deps chromium
          npm run test:e2e:smoke
      - if: matrix.check == 'security'
        run: npm audit --omit=dev --audit-level=high

  auth-ui:
    name: auth-ui
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.auth.config.ts
