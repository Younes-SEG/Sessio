name: Monthly maintenance

# Deletes AI usage records older than the start of the previous month, as the
# privacy policy promises ("deleted by a cleanup run at least monthly").
# Uses a least-privilege database login that can only read/delete AiAttempt and
# AiBucket rows (see docs/p0-operations.md "Privacy operations").
on:
  schedule:
    - cron: '17 9 1 * *' # 09:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-maintenance
  cancel-in-progress: false

jobs:
  prune-ai-usage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check configuration
        id: config
        env:
          URL: ${{ secrets.MAINTENANCE_DATABASE_URL }}
          TARGET: ${{ secrets.MAINTENANCE_DATABASE_TARGET }}
        run: |
          if [ -z "$URL" ] || [ -z "$TARGET" ]; then
            echo "::warning::Maintenance database secrets are not set; skipping AI usage cleanup."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: '24.21.0'
          cache: npm
      - if: steps.config.outputs.ready == 'true'
        run: npm ci
      - if: steps.config.outputs.ready == 'true'
        run: npm run db:generate
      - name: Prune old AI usage records
        if: steps.config.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.MAINTENANCE_DATABASE_URL }}
          COMMAND_OPERATIONS_TARGET: ${{ secrets.MAINTENANCE_DATABASE_TARGET }}
        run: npx tsx scripts/release-controls.ts ai-prune CONFIRM
