<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1b1d" media="(prefers-color-scheme: dark)" />
    <title>Offline · Command</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #faf9f6;
        --foreground: #302e2b;
        --muted: #6b6761;
        --primary: #536982;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #1b1b1d;
          --foreground: #ece9e4;
          --muted: #aaa7a2;
          --primary: #b3c1d3;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--background);
        color: var(--foreground);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 28rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.25rem;
      }
      p {
        margin: 0 0 1.25rem;
        color: var(--muted);
      }
      a {
        color: var(--primary);
        display: inline-block;
        min-height: 24px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!-- Static and public: the service worker caches only this page, never workspace data. -->
    <main>
      <section lang="en">
        <h1>You’re offline</h1>
        <p>Command can’t reach your workspace right now. Check your connection, then try again.</p>
      </section>
      <section lang="fr">
        <h1>Vous êtes hors ligne</h1>
        <p>
          Command ne peut pas joindre votre espace de travail pour le moment. Vérifiez votre
          connexion, puis réessayez.
        </p>
      </section>
      <a href="/">Try again · Réessayer</a>
    </main>
  </body>
</html>
